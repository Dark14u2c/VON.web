<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&family=Unbounded:wght@500;800&display=swap">
<style>
/* Layout: three full-height gates (calculator, riddle, VON) shown one at a time; a members layer slides over the VON gate after log in. One deliberate dark look. */
:root {
  --bg: #0e1110;
  --surface: #161a18;
  --raised: #1e2421;
  --line: #2b332f;
  --fg: #e8eae4;
  --muted: #8c968f;
  --accent: #d9a441;
  --accent-ink: #17120a;
  --danger: #e47a67;
  --ok: #79bd93;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Newsreader", Georgia, "Times New Roman", serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 18px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { height: 100%; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gate { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-block: 24px; box-sizing: border-box; }
.gate.enter { animation: fade .5s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
/* buttons and fields */
.btn {
  font-family: var(--f-mono); font-size: 14px; letter-spacing: .02em;
  padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--raised); color: var(--fg); cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="password"], textarea, select {
  font: inherit; font-size: 17px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; box-sizing: border-box; min-width: 0;
}
textarea { resize: vertical; }
select { width: auto; font-family: var(--f-mono); font-size: 14px; }
/* gate 1: calculator */
.calc { width: min(340px, 100%); display: flex; flex-direction: column; gap: 12px; }
.screen {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; min-height: 92px; box-sizing: border-box; text-align: right;
  font-family: var(--f-mono); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
}
.exp { color: var(--muted); font-size: 14px; min-height: 21px; white-space: nowrap; }
.val { font-size: 34px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key {
  height: 60px; font-family: var(--f-mono); font-size: 20px; color: var(--fg);
  background: var(--raised); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.key:hover { border-color: var(--muted); }
.key:active { background: var(--surface); }
.key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.key.op { color: var(--accent); }
.key.eq { grid-row: span 2; height: auto; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.key.zero { grid-column: span 2; }
/* gate 2: riddle */
.riddle { width: min(640px, 100%); }
.riddle.shake { animation: shake .35s ease; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 0; }
.q { font-style: italic; font-size: clamp(28px, 6vw, 46px); line-height: 1.2; text-wrap: balance; margin: 14px 0 32px; }
.ans { display: flex; gap: 12px; flex-wrap: wrap; }
.ans input { flex: 1 1 220px; font-size: 20px; }
.msg { min-height: 1.5em; margin: 14px 0 0; font-family: var(--f-mono); font-size: 14px; color: var(--muted); }
.msg.ok { color: var(--ok); }
.msg.err { color: var(--danger); }
/* gate 3: VON */
.von { font-family: var(--f-display); font-weight: 800; font-size: clamp(88px, 26vw, 320px); letter-spacing: .02em; line-height: 1; margin: 0; }
.corner {
  position: fixed; right: 0; bottom: 0;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) 0;
}
[hidden] { display: none !important; }
.btn.ghost { opacity: 0; cursor: default; width: 96px; height: 56px; padding: 0; }
/* login panel */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: rgba(8, 10, 9, .8);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.card {
  width: min(420px, 100%); box-sizing: border-box; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
}
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 20px; letter-spacing: .02em; }
.card p { margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.hint { font-size: 15px; color: var(--muted); }
.err { color: var(--danger); font-size: 15px; min-height: 1.4em; }
/* members area */
#members {
  position: fixed; inset: 0; z-index: 10; overflow: auto; background: var(--bg);
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.m-wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
.m-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .06em; }
.who { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 14px; }
.chip { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.allsee { border-color: var(--accent); color: var(--accent); }
.chip.owner { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.status { margin: 0; min-height: 1.4em; font-family: var(--f-mono); font-size: 14px; color: var(--muted); }
.status.ok { color: var(--ok); }
.status.err { color: var(--danger); }
.sec { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { margin: 0; font-family: var(--f-mono); font-size: 13px; text-transform: uppercase; letter-spacing: .14em; font-weight: 500; }
.sec-head span { font-size: 15px; }
.notes { display: flex; flex-direction: column; }
.note { border-top: 1px solid var(--line); padding: 16px 0; min-width: 0; }
.note h3 { margin: 0 0 6px; font-size: 22px; font-weight: 400; overflow-wrap: anywhere; }
.note .body { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts .btn { padding: 6px 12px; font-size: 13px; }
.ann .note { padding: 22px 0; }
.ann .note h3 { font-size: 26px; }
.when { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin-bottom: 6px; }
.empty { margin: 0; padding: 16px 0; border-top: 1px solid var(--line); color: var(--muted); }
.form { display: flex; flex-direction: column; gap: 14px; max-width: 560px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 16px; }
th { text-align: left; font-family: var(--f-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.card-form { display: flex; flex-direction: column; gap: 16px; }
.switch { align-self: flex-start; }
.code { font-family: var(--f-mono); font-size: 13px; user-select: all; word-break: break-all; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
</style>
</head>
<body>
<main>
  <section class="gate" id="g-calc" aria-label="Calculator">
    <div class="calc">
      <div class="screen" aria-live="polite">
        <div class="exp" id="c-exp">&nbsp;</div>
        <div class="val" id="c-val">0</div>
      </div>
      <div class="keys" id="keys">
        <button class="key op" type="button" data-k="C" aria-label="Clear">C</button>
        <button class="key op" type="button" data-k="B" aria-label="Backspace">&#9003;</button>
        <button class="key op" type="button" data-k="/" aria-label="Divide">&divide;</button>
        <button class="key op" type="button" data-k="*" aria-label="Multiply">&times;</button>
        <button class="key" type="button" data-k="7">7</button>
        <button class="key" type="button" data-k="8">8</button>
        <button class="key" type="button" data-k="9">9</button>
        <button class="key op" type="button" data-k="-" aria-label="Subtract">&minus;</button>
        <button class="key" type="button" data-k="4">4</button>
        <button class="key" type="button" data-k="5">5</button>
        <button class="key" type="button" data-k="6">6</button>
        <button class="key op" type="button" data-k="+" aria-label="Add">+</button>
        <button class="key" type="button" data-k="1">1</button>
        <button class="key" type="button" data-k="2">2</button>
        <button class="key" type="button" data-k="3">3</button>
        <button class="key eq" type="button" data-k="=" aria-label="Equals">=</button>
        <button class="key zero" type="button" data-k="0">0</button>
        <button class="key" type="button" data-k="." aria-label="Decimal point">.</button>
      </div>
    </div>
  </section>
  <section class="gate" id="g-riddle" aria-label="Riddle" hidden>
    <form class="riddle" id="riddle-form" autocomplete="off">
      <p class="eyebrow">Asked at the gates of Thebes</p>
      <p class="q">What goes on four legs in the morning, on two legs at noon, and on three legs in the evening?</p>
      <div class="ans">
        <label class="sr" for="answer">Your answer</label>
        <input id="answer" name="answer" type="text" placeholder="Your answer" autocapitalize="off" spellcheck="false">
        <button class="btn primary" type="submit">Answer</button>
      </div>
      <p class="msg" id="riddle-msg" role="status" aria-live="polite"></p>
    </form>
  </section>
  <section class="gate" id="g-von" aria-label="VON" hidden>
    <h1 class="von">VON</h1>
  </section>
</main>
<div class="corner" id="corner" hidden>
  <button class="btn ghost" type="button" id="btn-login" aria-label="Log in">Log in</button>
</div>
<div class="overlay" id="login" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
  <div class="card" id="login-body"></div>
</div>
<div id="members" hidden></div>

  /* ---------- keyboard ---------- */

  /* ---------- roles and data ---------- */

  var M = {};
  /* ---------- log in panel ---------- */

  function closeLogin() { $('#login').hidden = true; if (!S.in) $('#btn-login').focus(); }

  function renderAuth(mode) {

  function logoutBtn() { return h('button', { class: 'btn', type: 'button', text: 'Log out', onclick: logout }); }

  /* ---------- session ---------- */
  async function proceed(user) {

  function composer(fixedKind, heading, titleLabel, bodyLabel, submitLabel, doneMsg) {

          ];

        }

    });

      h('table', null,
        h('thead', null, h('tr', null, h('th', { text: 'Username' }), h('th', { text: 'Joined' }), h('th', { text: 'Role' }))),
        h('tbody', null, rows)

  }
  show();
})();
