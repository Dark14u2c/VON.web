<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&family=Unbounded:wght@500;800&display=swap">
<style>
/* Three gates (calculator, riddle, VON) shown one at a time; a members layer covers the VON gate after log in. */
:root {
  --bg:#0e1110; --surface:#161a18; --raised:#1e2421; --line:#2b332f; --fg:#e8eae4; --muted:#8c968f;
  --accent:#d9a441; --accent-ink:#17120a; --danger:#e47a67; --ok:#79bd93;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html, body { height:100%; }
body { margin:0; box-sizing:border-box; background:var(--bg); color:var(--fg); font:18px/1.5 var(--f-body);
  padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
main { height:100%; }
[hidden] { display:none !important; }
.muted { color:var(--muted); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.gate { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-block:24px; box-sizing:border-box; }
.gate.enter { animation:fade .5s ease both; }
@keyframes fade { from { opacity:0; } }
@keyframes shake { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }

/* buttons and fields */
.btn { font:14px var(--f-mono); letter-spacing:.02em; padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:var(--raised); color:var(--fg); cursor:pointer; }
.btn:hover { border-color:var(--accent); }
.btn:disabled { opacity:.5; cursor:default; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500; }
.btn.danger { border-color:var(--danger); color:var(--danger); }
.btn.ghost { opacity:0; cursor:default; width:96px; height:56px; padding:0; }
:is(.btn, .key, input, textarea, select):focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
input[type=text], input[type=password], textarea, select { font:inherit; font-size:17px; color:var(--fg); background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; width:100%; box-sizing:border-box; min-width:0; }
textarea { resize:vertical; }
select { width:auto; font-family:var(--f-mono); font-size:14px; }

/* gate 1: calculator */
.calc { width:min(340px, 100%); display:flex; flex-direction:column; gap:12px; }
.screen { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-height:92px; box-sizing:border-box;
  text-align:right; font-family:var(--f-mono); display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; }
.exp { color:var(--muted); font-size:14px; min-height:21px; white-space:nowrap; }
.val { font-size:34px; line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; }
.keys { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
.key { height:60px; font:20px var(--f-mono); color:var(--fg); background:var(--raised); border:1px solid var(--line); border-radius:10px; cursor:pointer; }
.key:hover { border-color:var(--muted); }
.key:active { background:var(--surface); }
.key.op { color:var(--accent); }
.key.eq { grid-row:span 2; height:auto; background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500; }
.key.zero { grid-column:span 2; }

/* gate 2: riddle */
.riddle { width:min(640px, 100%); }
.riddle.shake { animation:shake .35s ease; }
.eyebrow { font:12px var(--f-mono); text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin:0; }
.q { font-style:italic; font-size:clamp(28px, 6vw, 46px); line-height:1.2; text-wrap:balance; margin:14px 0 32px; }
.ans { display:flex; gap:12px; flex-wrap:wrap; }
.ans input { flex:1 1 220px; font-size:20px; }
.msg { min-height:1.5em; margin:14px 0 0; font:14px var(--f-mono); color:var(--muted); }
.msg.ok, .status.ok { color:var(--ok); }
.msg.err, .status.err { color:var(--danger); }

/* gate 3: VON */
.von { font:800 clamp(88px, 26vw, 320px)/1 var(--f-display); letter-spacing:.02em; margin:0; }
.corner { position:fixed; right:0; bottom:0; padding:0 max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) 0; }

/* login panel */
.overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:rgba(8,10,9,.8); padding:max(16px, env(safe-area-inset-top, 0px)) 16px; }
.card { width:min(420px, 100%); box-sizing:border-box; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:16px; }
.card h2 { margin:0; font:500 20px var(--f-display); letter-spacing:.02em; }
.card p { margin:0; }
.card-form { display:flex; flex-direction:column; gap:16px; }
.switch { align-self:flex-start; }
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font:13px var(--f-mono); color:var(--muted); }
.row { display:flex; gap:10px; flex-wrap:wrap; }
.hint { font-size:15px; color:var(--muted); }
.err { color:var(--danger); font-size:15px; min-height:1.4em; }
.code { font:13px var(--f-mono); user-select:all; word-break:break-all; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }

/* members area */
#members { position:fixed; inset:0; z-index:10; overflow:auto; background:var(--bg);
  padding:max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.m-wrap { max-width:780px; margin:0 auto; display:flex; flex-direction:column; gap:32px; }
.m-head { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.brand { font:800 22px var(--f-display); letter-spacing:.06em; }
.who { display:flex; align-items:center; gap:12px; flex-wrap:wrap; font:14px var(--f-mono); }
.chip { font:12px var(--f-mono); text-transform:uppercase; letter-spacing:.1em; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
.chip.allsee { border-color:var(--accent); color:var(--accent); }
.chip.owner { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.status { margin:0; min-height:1.4em; font:14px var(--f-mono); color:var(--muted); }
.sec { display:flex; flex-direction:column; gap:14px; min-width:0; }
.sec-head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.sec-head h2 { margin:0; font:500 13px var(--f-mono); text-transform:uppercase; letter-spacing:.14em; }
.sec-head span { font-size:15px; }
.notes { display:flex; flex-direction:column; }
.note { border-top:1px solid var(--line); padding:16px 0; min-width:0; }
.note h3 { margin:0 0 6px; font-size:22px; font-weight:400; overflow-wrap:anywhere; }
.note .body { margin:0 0 10px; white-space:pre-wrap; overflow-wrap:anywhere; }
.meta { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font:12px var(--f-mono); color:var(--muted); }
.acts { display:flex; gap:8px; flex-wrap:wrap; }
.acts .btn { padding:6px 12px; font-size:13px; }
.ann .note { padding:22px 0; }
.ann .note h3 { font-size:26px; }
.when { font:12px var(--f-mono); text-transform:uppercase; letter-spacing:.12em; color:var(--accent); margin-bottom:6px; }
.empty { margin:0; padding:16px 0; border-top:1px solid var(--line); color:var(--muted); }
.form { display:flex; flex-direction:column; gap:14px; max-width:560px; }
.tablewrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:16px; }
th { text-align:left; font:500 12px var(--f-mono); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); padding:8px 12px 8px 0; border-bottom:1px solid var(--line); }
td { padding:10px 12px 10px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
@media (prefers-reduced-motion:reduce) { *, ::before, ::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main>
  <section class="gate" id="g-calc" aria-label="Calculator">
    <div class="calc">
      <div class="screen" aria-live="polite"><div class="exp" id="c-exp">&nbsp;</div><div class="val" id="c-val">0</div></div>
      <div class="keys" id="keys">
        <button class="key op" type="button" data-k="C" aria-label="Clear">C</button>
        <button class="key op" type="button" data-k="B" aria-label="Backspace">&#9003;</button>
        <button class="key op" type="button" data-k="/" aria-label="Divide">&divide;</button>
        <button class="key op" type="button" data-k="*" aria-label="Multiply">&times;</button>
        <button class="key" type="button" data-k="7">7</button>
        <button class="key" type="button" data-k="8">8</button>
        <button class="key" type="button" data-k="9">9</button>
        <button class="key op" type="button" data-k="-" aria-label="Subtract">&minus;</button>
        <button class="key" type="button" data-k="4">4</button>
        <button class="key" type="button" data-k="5">5</button>
        <button class="key" type="button" data-k="6">6</button>
        <button class="key op" type="button" data-k="+" aria-label="Add">+</button>
        <button class="key" type="button" data-k="1">1</button>
        <button class="key" type="button" data-k="2">2</button>
        <button class="key" type="button" data-k="3">3</button>
        <button class="key eq" type="button" data-k="=" aria-label="Equals">=</button>
        <button class="key zero" type="button" data-k="0">0</button>
        <button class="key" type="button" data-k="." aria-label="Decimal point">.</button>
      </div>
    </div>
  </section>

  <section class="gate" id="g-riddle" aria-label="Riddle" hidden>
    <form class="riddle" id="riddle-form" autocomplete="off">
      <p class="eyebrow">Asked at the gates of Thebes</p>
      <p class="q">What goes on four legs in the morning, on two legs at noon, and on three legs in the evening?</p>
      <div class="ans">
        <label class="sr" for="answer">Your answer</label>
        <input id="answer" type="text" placeholder="Your answer" autocapitalize="off" spellcheck="false">
        <button class="btn primary" type="submit">Answer</button>
      </div>
      <p class="msg" id="riddle-msg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="gate" id="g-von" aria-label="VON" hidden><h1 class="von">VON</h1></section>
</main>

<div class="corner" id="corner" hidden><button class="btn ghost" type="button" id="btn-login" aria-label="Log in">Log in</button></div>
<div class="overlay" id="login" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden><div class="card" id="login-body"></div></div>
<div id="members" hidden></div>

<script type="module">
/* Firebase web config. These values are public by design; your Firestore rules protect the data. */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCbn1HiOqy7FicrVF7432Re12srPS_Vz-4',
  authDomain: 'von-web.firebaseapp.com',
  projectId: 'von-web',
  storageBucket: 'von-web.firebasestorage.app',
  messagingSenderId: '499141755942',
  appId: '1:499141755942:web:2d96f3fdca86942dc2d2e7',
};
const EMAIL_DOMAIN = 'vonsite.example'; // usernames become carol@vonsite.example; nothing is ever emailed
const FIREBASE_VERSION = '10.14.1';

const $ = (s, r = document) => r.querySelector(s);
const h = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  e.append(...kids.flat(Infinity).filter(c => c != null && c !== false));
  return e;
};
const field = (id, label, control) => h('div', { class: 'field' }, h('label', { for: id, text: label }), control);
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
const setKids = (el, nodes) => el.replaceChildren(...nodes.filter(Boolean));

/* ---------- Firebase backend ---------- */
const COLLECTION = { ann: 'announcements', pub: 'notes_public', all: 'notes_allsee' };

async function createBackend() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [{ initializeApp }, A, F] = await Promise.all(['app', 'auth', 'firestore'].map(m => import(`${base}firebase-${m}.js`)));
  const auth = A.getAuth(initializeApp(FIREBASE_CONFIG));
  const db = F.getFirestore(auth.app);

  const emailOf = name => `${name.toLowerCase()}@${EMAIL_DOMAIN}`;
  const asUser = u => u && { uid: u.uid, username: (u.email || '').split('@')[0] };
  const iso = ts => (ts?.toDate ? ts.toDate() : new Date()).toISOString();
  const read = d => d.data({ serverTimestamps: 'estimate' });
  const toItem = d => { const x = read(d); return { id: d.id, title: x.title, body: x.body, createdAt: iso(x.createdAt) }; };
  const toProfile = s => { if (!s.exists()) return null; const x = read(s); return { username: x.username, status: x.status, role: x.role, createdAt: iso(x.createdAt) }; };
  const userDoc = uid => F.doc(db, 'users', uid);
  const saveProfile = (uid, username) => F.setDoc(userDoc(uid), { username, status: 'pending', role: 'user', createdAt: F.serverTimestamp() });
  const authReady = () => new Promise(resolve => { const off = A.onAuthStateChanged(auth, () => { resolve(); off(); }); });

  return {
    currentUser: async () => { await authReady(); return asUser(auth.currentUser); },
    signUp: async (name, pw) => {
      const c = await A.createUserWithEmailAndPassword(auth, emailOf(name), pw);
      await saveProfile(c.user.uid, name);
      return { uid: c.user.uid, username: name };
    },
    signIn: async (name, pw) => asUser((await A.signInWithEmailAndPassword(auth, emailOf(name), pw)).user),
    signOut: () => A.signOut(auth),
    getProfile: async uid => toProfile(await F.getDoc(userDoc(uid))),
    createProfile: async name => { await saveProfile(auth.currentUser.uid, name); return { username: name, status: 'pending', role: 'user' }; },
    getSite: async () => { const s = await F.getDoc(F.doc(db, 'config', 'site')); return s.exists() ? s.data() : null; },
    watchProfile: (uid, cb) => F.onSnapshot(userDoc(uid), s => cb(toProfile(s), null), e => cb(null, e)),
    watch: (kind, cb) => F.onSnapshot(F.query(F.collection(db, COLLECTION[kind]), F.orderBy('createdAt', 'desc')), s => cb(s.docs.map(toItem), null), e => cb(null, e)),
    watchUsers: cb => F.onSnapshot(F.collection(db, 'users'), s => cb(s.docs.map(d => ({ ...toProfile(d), uid: d.id })), null), e => cb(null, e)),
    addItem: (kind, i) => F.addDoc(F.collection(db, COLLECTION[kind]), { title: i.title, body: i.body, createdAt: F.serverTimestamp(), updatedAt: F.serverTimestamp() }),
    updateItem: (kind, id, i) => F.updateDoc(F.doc(db, COLLECTION[kind], id), { title: i.title, body: i.body, updatedAt: F.serverTimestamp() }),
    deleteItem: (kind, id) => F.deleteDoc(F.doc(db, COLLECTION[kind], id)),
    setUserStatus: (uid, status) => F.updateDoc(userDoc(uid), { status }),
    setUserRole: (uid, role) => F.updateDoc(userDoc(uid), { role }),
  };
}

let backend = null, backendP = null;
const getBackend = () => (backendP ??= createBackend()).then(b => (backend = b));

const ERRORS = {
  'auth/email-already-in-use': 'That username is taken.',
  'auth/invalid-credential': 'Wrong username or password.',
  'auth/wrong-password': 'Wrong username or password.',
  'auth/user-not-found': 'Wrong username or password.',
  'auth/invalid-login-credentials': 'Wrong username or password.',
  'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.',
  'auth/network-request-failed': 'Could not reach the server. Check your connection and try again.',
  'unavailable': 'Could not reach the server. Check your connection and try again.',
  'auth/operation-not-allowed': 'Email and password sign-in is not turned on in Firebase yet.',
  'auth/weak-password': 'Choose a stronger password.',
  'permission-denied': 'The database refused that. Your access may have changed.',
};
const explain = e => ERRORS[e?.code] || e?.message || 'Something went wrong. Try again.';

/* ---------- gates ---------- */
const gates = { calc: $('#g-calc'), riddle: $('#g-riddle'), von: $('#g-von') };
let current = 'calc';
const S = { in: false, role: 'user', username: '', uid: null, ownerUid: null, unsubs: [] };

function go(name) {
  current = name;
  for (const k in gates) gates[k].hidden = k !== name;
  const g = gates[name];
  g.classList.remove('enter'); void g.offsetWidth; g.classList.add('enter');
  $('#corner').hidden = name !== 'von' || S.in;
  if (name === 'riddle') setTimeout(() => $('#answer').focus(), 60);
}

/* ---------- gate 1: calculator (enter 4 + 5 = to continue) ---------- */
const calc = { cur: '0', prev: null, op: null, fresh: true, afterEq: false, entry: '', lastEntry: '', locked: false };
const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const OPS = '+-*/';

const fmt = n => {
  if (!isFinite(n)) return 'Error';
  const s = String(parseFloat(Number(n).toPrecision(12)));
  return s.length > 14 ? Number(n).toExponential(6) : s;
};
const apply = (a, op, b) => op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : (b === 0 ? NaN : a / b);
const pretty = entry => entry.replace(/(?!^)([+\-*\/])/g, ' $1 ').replace(/[*\/-]/g, (c, i) => (i === 0 && c === '-') ? c : SYM[c]);

function show() {
  $('#c-val').textContent = calc.cur;
  const line = calc.afterEq ? pretty(calc.lastEntry) + ' =' : pretty(calc.entry);
  $('#c-exp').textContent = line.trim() ? line : ' ';
}
function resetCalc() { Object.assign(calc, { cur: '0', prev: null, op: null, fresh: true, afterEq: false, entry: '', lastEntry: '', locked: false }); }
function digit(k) {
  if (calc.fresh) {
    if (calc.afterEq) { calc.entry = ''; calc.afterEq = false; }
    calc.cur = k === '.' ? '0.' : k;
    calc.fresh = false;
  } else {
    if (k === '.' && calc.cur.includes('.')) return;
    if (calc.cur.replace(/[-.]/g, '').length >= 12) return;
    calc.cur = (calc.cur === '0' && k !== '.') ? k : calc.cur + k;
  }
  calc.entry += k;
}
function oper(k) {
  if (calc.op && calc.fresh) { calc.entry = calc.entry.slice(0, -1) + k; calc.op = k; return; }
  if (calc.afterEq) { calc.entry = calc.cur; calc.afterEq = false; }
  if (!calc.entry) calc.entry = calc.cur;
  if (calc.op) { calc.prev = apply(calc.prev, calc.op, Number(calc.cur)); calc.cur = fmt(calc.prev); }
  else calc.prev = Number(calc.cur);
  calc.entry += k; calc.op = k; calc.fresh = true;
}
function equals() {
  if (!calc.op) return;
  const hit = calc.entry === '4+5' && !calc.fresh;
  const r = apply(calc.prev, calc.op, Number(calc.cur));
  Object.assign(calc, { lastEntry: calc.entry, cur: fmt(r), prev: null, op: null, fresh: true, afterEq: true });
  if (hit && r === 9) { calc.locked = true; setTimeout(() => go('riddle'), 900); }
}
function back() {
  if (calc.fresh || calc.afterEq) return;
  calc.cur = (calc.cur.length <= 1 || (calc.cur.length === 2 && calc.cur[0] === '-')) ? '0' : calc.cur.slice(0, -1);
  calc.entry = calc.entry.slice(0, -1);
}
function press(k) {
  if (calc.locked) return;
  if (calc.cur === 'Error' && k !== 'C') resetCalc();
  if (/^\d$/.test(k) || k === '.') digit(k);
  else if (OPS.includes(k)) oper(k);
  else if (k === '=') equals();
  else if (k === 'C') resetCalc();
  else if (k === 'B') back();
  show();
}
$('#keys').addEventListener('click', ev => { const b = ev.target.closest('button[data-k]'); if (b) press(b.dataset.k); });

/* ---------- gate 2: riddle ---------- */
const ACCEPT = ['man', 'a man', 'the man', 'men', 'human', 'a human', 'the human', 'humans', 'human being', 'a human being', 'mankind', 'humankind'];
const normalize = s => s.toLowerCase().replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ').trim().replace(/^(it is|its|the answer is|answer is)\s+/, '');

$('#riddle-form').addEventListener('submit', ev => {
  ev.preventDefault();
  const input = $('#answer'), msg = $('#riddle-msg'), box = $('#riddle-form');
  if (ACCEPT.includes(normalize(input.value))) {
    msg.textContent = 'Correct.'; msg.className = 'msg ok';
    input.disabled = true;
    setTimeout(() => go('von'), 900);
  } else {
    msg.textContent = input.value.trim() ? 'That is not the answer. Try again.' : 'Type your answer first.';
    msg.className = 'msg err';
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    input.select();
  }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#login').hidden) return closeLogin();
  if (current !== 'calc' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const map = { Enter: '=', Backspace: 'B', Escape: 'C', c: 'C', x: '*', X: '*' };
  const key = map[ev.key] || ev.key;
  if (/^\d$/.test(key) || key === '.' || key === '=' || key === 'B' || key === 'C' || (key.length === 1 && OPS.includes(key))) {
    ev.preventDefault();
    press(key);
  }
});

/* ---------- roles and data ---------- */
const ROLE_LABEL = { user: 'User', allsee: 'Allsee', owner: 'Owner' };
const ROLE_NOTE = { user: 'View only', allsee: 'Sees the extra notes', owner: 'Can change anything' };
const D = { ann: null, pub: null, all: null, users: null };
const M = {};

/* ---------- log in panel ---------- */
function showLogin(nodes) {
  const body = $('#login-body');
  setKids(body, nodes);
  $('#login').hidden = false;
  setTimeout(() => { if (!body.contains(document.activeElement)) $('#login-body input, #login-body button')?.focus(); }, 30);
}
function closeLogin() { $('#login').hidden = true; if (!S.in) $('#btn-login').focus(); }
const closeBtn = label => h('button', { class: 'btn', type: 'button', text: label || 'Close', onclick: closeLogin });
$('#login').addEventListener('click', ev => { if (ev.target === $('#login')) closeLogin(); });
const showMessage = (title, text) => showLogin([h('h2', { id: 'login-title', text: title }), h('p', { text }), h('div', { class: 'row' }, closeBtn())]);

function openLogin() {
  showLogin([h('h2', { id: 'login-title', text: 'Log in' }), h('p', { class: 'hint', text: 'One moment…' })]);
  getBackend()
    .then(b => b.currentUser())
    .then(u => u ? proceed(u) : renderAuth('login'))
    .catch(e => { backendP = null; showMessage('Could not log in', explain(e)); });
}

function renderAuth(mode) {
  const signup = mode === 'signup';
  const user = h('input', { id: 'au-name', type: 'text', maxlength: '24', autocomplete: 'username', autocapitalize: 'off', spellcheck: 'false' });
  const pass = h('input', { id: 'au-pass', type: 'password', maxlength: '200', autocomplete: signup ? 'new-password' : 'current-password' });
  const pass2 = signup && h('input', { id: 'au-pass2', type: 'password', maxlength: '200', autocomplete: 'new-password' });
  const err = h('p', { class: 'err', role: 'alert' });
  const btn = h('button', { class: 'btn primary', type: 'submit', text: signup ? 'Request account' : 'Log in' });
  const fail = (msg, el) => { err.textContent = msg; el.focus(); };

  const form = h('form', {
    class: 'card-form', novalidate: true,
    onsubmit: ev => {
      ev.preventDefault();
      const name = user.value.trim(), pw = pass.value;
      if (!/^[A-Za-z0-9_]{3,24}$/.test(name)) return fail('Use 3 to 24 letters, numbers or underscores for the username.', user);
      if (!pw) return fail('Enter your password.', pass);
      if (signup && pw.length < 8) return fail('Use a password with at least 8 characters.', pass);
      if (signup && pw !== pass2.value) return fail('The two passwords do not match.', pass2);
      err.textContent = ''; btn.disabled = true;
      (signup ? backend.signUp(name, pw) : backend.signIn(name, pw))
        .then(proceed)
        .catch(e => { btn.disabled = false; err.textContent = explain(e); });
    },
  },
    field('au-name', 'Username', user),
    field('au-pass', 'Password', pass),
    signup && field('au-pass2', 'Repeat password', pass2),
    err,
    h('div', { class: 'row' }, btn, closeBtn('Cancel'))
  );
  showLogin([
    h('h2', { id: 'login-title', text: signup ? 'Request an account' : 'Log in' }),
    signup && h('p', { class: 'hint', text: 'The owner has to accept your request before you can get in.' }),
    form,
    h('button', { class: 'btn switch', type: 'button', text: signup ? 'I already have an account' : 'Create an account', onclick: () => renderAuth(signup ? 'login' : 'signup') }),
  ]);
}

const logoutBtn = () => h('button', { class: 'btn', type: 'button', text: 'Log out', onclick: logout });

function showPending(username, uid, noOwnerYet) {
  showLogin([
    h('h2', { id: 'login-title', text: 'Waiting for approval' }),
    h('p', { text: `Your account request for "${username}" has been sent. You can get in once the owner accepts it.` }),
    noOwnerYet && h('p', { class: 'hint', text: 'This site has no owner yet. If you are setting it up, this is your account ID. Put it in Firebase as the owner (config/site, field ownerUid):' }),
    noOwnerYet && h('div', { class: 'code', text: uid }),
    h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', text: 'Check again', onclick: openLogin }), logoutBtn(), closeBtn()),
  ]);
}

/* ---------- session ---------- */
async function proceed(user) {
  let site = null;
  try { site = await backend.getSite(); } catch { }
  const ownerUid = site?.ownerUid || null;
  let prof = await backend.getProfile(user.uid);
  if (ownerUid === user.uid) return enter({ uid: user.uid, username: prof?.username || user.username, role: 'owner', ownerUid });
  prof ||= await backend.createProfile(user.username);
  if (prof.status === 'approved') {
    enter({ uid: user.uid, username: prof.username, role: prof.role === 'allsee' ? 'allsee' : 'user', ownerUid });
  } else if (prof.status === 'declined') {
    leaveMembers();
    showLogin([h('h2', { id: 'login-title', text: 'Request declined' }), h('p', { text: 'The owner did not accept this account.' }), h('div', { class: 'row' }, logoutBtn(), closeBtn())]);
  } else {
    leaveMembers();
    showPending(prof.username, user.uid, !ownerUid);
  }
}

function stopWatching() { S.unsubs.forEach(f => { try { f(); } catch { } }); S.unsubs = []; }
function leaveMembers() {
  stopWatching();
  S.in = false;
  $('#members').hidden = true;
  $('#members').replaceChildren();
  $('#corner').hidden = current !== 'von';
}
function logout() {
  leaveMembers();
  $('#login').hidden = true;
  backend?.signOut()?.catch?.(() => { });
  if (current === 'von') $('#btn-login').focus();
}
$('#btn-login').addEventListener('click', openLogin);

let checking = false;
async function recheck() {
  if (checking) return;
  checking = true;
  try {
    stopWatching();
    const u = await backend.currentUser();
    leaveMembers();
    if (u) await proceed(u); else renderAuth('login');
  } catch (e) {
    leaveMembers();
    showMessage('Could not check your access', explain(e));
  } finally { checking = false; }
}
function onWatchError(e) {
  if (['permission-denied', 'unauthenticated'].includes(e?.code)) recheck();
  else setStatus(explain(e), 'err');
}

function enter(info) {
  Object.assign(S, { in: true, username: info.username, role: info.role, uid: info.uid, ownerUid: info.ownerUid });
  D.ann = D.pub = D.all = D.users = null;
  $('#login').hidden = true;
  $('#corner').hidden = true;
  buildMembers();
  startWatching();
}

function startWatching() {
  stopWatching();
  const watchKind = kind => S.unsubs.push(backend.watch(kind, (items, err) => {
    if (err) return onWatchError(err);
    D[kind] = items;
    if (!(M.editing && M.editing.kind === kind)) renderList(kind);
  }));
  watchKind('ann');
  watchKind('pub');
  if (S.role !== 'user') watchKind('all');
  if (S.role === 'owner') {
    S.unsubs.push(backend.watchUsers((list, err) => {
      if (err) return onWatchError(err);
      D.users = list;
      const a = document.activeElement;
      if (!(a && M.people?.contains(a) && a.tagName === 'SELECT')) renderPeople();
    }));
  } else {
    S.unsubs.push(backend.watchProfile(S.uid, (p, err) => {
      if (err) return onWatchError(err);
      if (!p || p.status !== 'approved' || (p.role === 'allsee' ? 'allsee' : 'user') !== S.role) recheck();
    }));
  }
}

function setStatus(msg, kind) {
  if (!M.status) return;
  M.status.textContent = msg;
  M.status.className = 'status ' + (kind || '');
}

/* ---------- members area ---------- */
const section = (title, sub, body) => h('section', { class: 'sec' }, h('div', { class: 'sec-head' }, h('h2', { text: title }), h('span', { class: 'muted', text: sub })), body);

function buildMembers() {
  const role = S.role, owner = role === 'owner';
  M.status = h('p', { class: 'status', role: 'status', 'aria-live': 'polite' });
  M.ann = h('div', { class: 'notes ann' });
  M.pub = h('div', { class: 'notes' });
  M.all = role !== 'user' ? h('div', { class: 'notes' }) : null;
  M.people = owner ? h('div') : null;
  M.editing = M.confirm = M.confirmUser = null;

  const head = h('header', { class: 'm-head' },
    h('span', { class: 'brand', text: 'VON' }),
    h('div', { class: 'who' }, h('span', { text: S.username }), h('span', { class: 'chip ' + role, text: ROLE_LABEL[role] }), h('span', { class: 'muted', text: ROLE_NOTE[role] }), logoutBtn())
  );
  const root = $('#members');
  root.replaceChildren(h('div', { class: 'm-wrap' },
    head, M.status,
    section('Announcements', 'Posted by the owner', M.ann),
    owner && composer('ann', 'Post an announcement', 'Headline', 'Message', 'Post announcement', 'Announcement posted.'),
    section('Notes', 'Visible to every role', M.pub),
    M.all && section('Allsee notes', 'Only allsee and owners see these', M.all),
    owner && composer(null, 'New note', 'Title', 'Note', 'Post note', 'Note posted.'),
    owner && section('People', 'Accept new accounts and set roles', M.people)
  ));
  root.hidden = false;
  ['ann', 'pub', 'all'].forEach(renderList);
  renderPeople();
}

function composer(fixedKind, heading, titleLabel, bodyLabel, submitLabel, doneMsg) {
  const key = fixedKind || 'note';
  const title = h('input', { id: key + '-title', type: 'text', maxlength: '120' });
  const body = h('textarea', { id: key + '-body', rows: '4', maxlength: '4000' });
  const aud = fixedKind ? null : h('select', { id: 'n-aud' }, h('option', { value: 'pub', text: 'Everyone' }), h('option', { value: 'all', text: 'Allsee and owners only' }));
  const btn = h('button', { class: 'btn primary', type: 'submit', text: submitLabel });
  const form = h('form', {
    class: 'form', novalidate: true,
    onsubmit: ev => {
      ev.preventDefault();
      const t = title.value.trim();
      if (!t) { setStatus('Add a title first.', 'err'); title.focus(); return; }
      btn.disabled = true;
      backend.addItem(fixedKind || aud.value, { title: t, body: body.value.trim() })
        .then(() => { title.value = body.value = ''; setStatus(doneMsg, 'ok'); })
        .catch(e => setStatus(explain(e), 'err'))
        .then(() => { btn.disabled = false; });
    },
  },
    field(key + '-title', titleLabel, title),
    field(key + '-body', bodyLabel, body),
    aud && field('n-aud', 'Who sees it', aud),
    h('div', { class: 'row' }, btn)
  );
  return section(heading, 'Owners only', form);
}

function renderList(kind) {
  const box = M[kind], items = D[kind];
  if (!box) return;
  if (items === null) return setKids(box, [h('p', { class: 'empty', text: 'Loading…' })]);
  if (!items.length) {
    const owner = S.role === 'owner';
    const msg = kind === 'ann'
      ? (owner ? 'No announcements yet. Post the first one below.' : 'No announcements yet.')
      : (owner ? 'Nothing here yet. Post the first note below.' : 'Nothing has been posted here yet.');
    return setKids(box, [h('p', { class: 'empty', text: msg })]);
  }
  setKids(box, items.map(n => noteEl(kind, n)));
}

function noteEl(kind, n) {
  const owner = S.role === 'owner';
  if (owner && M.editing?.kind === kind && M.editing.id === n.id) return editEl(kind, n);
  let acts = null;
  if (owner) {
    const key = kind + ':' + n.id;
    const del = M.confirm === key
      ? [
          h('button', {
            class: 'btn danger', type: 'button', text: 'Confirm delete',
            onclick: () => { M.confirm = null; backend.deleteItem(kind, n.id).then(() => setStatus('Deleted.', 'ok')).catch(e => { setStatus(explain(e), 'err'); renderList(kind); }); },
          }),
          h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => { M.confirm = null; renderList(kind); } }),
        ]
      : h('button', { class: 'btn', type: 'button', text: 'Delete', onclick: () => { M.confirm = key; renderList(kind); } });
    acts = h('div', { class: 'acts' },
      h('button', { class: 'btn', type: 'button', text: 'Edit', onclick: () => { M.editing = { kind, id: n.id, draft: { title: n.title || '', body: n.body || '' } }; M.confirm = null; renderList(kind); } }),
      del
    );
  }
  return h('article', { class: 'note' },
    kind === 'ann' && h('div', { class: 'when', text: fmtDate(n.createdAt) }),
    h('h3', { text: n.title || '(untitled)' }),
    n.body && h('p', { class: 'body', text: n.body }),
    (kind === 'ann' && !acts) ? null : h('div', { class: 'meta' }, kind !== 'ann' && h('span', { text: fmtDate(n.createdAt) }), acts)
  );
}

function editEl(kind, n) {
  const draft = M.editing.draft;
  const t = h('input', { id: 'e-title', type: 'text', maxlength: '120', value: draft.title, oninput: () => { draft.title = t.value; } });
  const b = h('textarea', { id: 'e-body', rows: '4', maxlength: '4000', oninput: () => { draft.body = b.value; } });
  b.value = draft.body;
  const save = h('button', { class: 'btn primary', type: 'submit', text: 'Save' });
  return h('form', {
    class: 'note form', novalidate: true,
    onsubmit: ev => {
      ev.preventDefault();
      const title = draft.title.trim();
      if (!title) return setStatus('A note needs a title.', 'err');
      save.disabled = true;
      backend.updateItem(kind, n.id, { title, body: draft.body.trim() })
        .then(() => { M.editing = null; setStatus('Saved.', 'ok'); renderList(kind); })
        .catch(e => { save.disabled = false; setStatus(explain(e), 'err'); });
    },
  },
    field('e-title', 'Title', t),
    field('e-body', 'Note', b),
    h('div', { class: 'row' }, save, h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => { M.editing = null; renderList(kind); } }))
  );
}

function renderPeople() {
  if (!M.people) return;
  if (D.users === null) return setKids(M.people, [h('p', { class: 'empty', text: 'Loading…' })]);
  const us = D.users.filter(u => u.uid !== S.ownerUid);
  if (!us.length) return setKids(M.people, [h('p', { class: 'empty', text: 'Nobody else has made an account yet. Share the site address, then accept requests here.' })]);

  const act = (promise, okMsg) => promise.then(() => setStatus(okMsg, 'ok')).catch(e => { setStatus(explain(e), 'err'); renderPeople(); });
  const statusBtn = (u, label, cls, status, msg) => {
    const b = h('button', { class: 'btn ' + cls, type: 'button', text: label });
    b.addEventListener('click', () => { b.disabled = true; act(backend.setUserStatus(u.uid, status), msg); });
    return b;
  };
  const waiting = us.filter(u => u.status === 'pending').length;
  const banner = waiting && h('p', { class: 'status ok', text: `${waiting} ${waiting === 1 ? 'account is' : 'accounts are'} waiting for your approval.` });
  const rank = { pending: 0, approved: 1, declined: 2 };

  const rows = us.slice().sort((a, b) => ((rank[a.status] || 0) - (rank[b.status] || 0)) || a.username.localeCompare(b.username)).map(u => {
    let cell;
    if (u.status === 'approved') {
      const sel = h('select', {
        'aria-label': 'Role for ' + u.username,
        onchange: () => { sel.disabled = true; act(backend.setUserRole(u.uid, sel.value), `${u.username} is now ${ROLE_LABEL[sel.value]}.`).then(() => { sel.disabled = false; }); },
      }, ['user', 'allsee'].map(r => h('option', { value: r, text: ROLE_LABEL[r], selected: r === u.role })));
      const remove = M.confirmUser === u.uid
        ? [
            h('button', { class: 'btn danger', type: 'button', text: 'Confirm remove access', onclick: () => { M.confirmUser = null; act(backend.setUserStatus(u.uid, 'declined'), `${u.username} no longer has access.`); } }),
            h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => { M.confirmUser = null; renderPeople(); } }),
          ]
        : h('button', { class: 'btn', type: 'button', text: 'Remove access', onclick: () => { M.confirmUser = u.uid; renderPeople(); } });
      cell = h('div', { class: 'acts' }, sel, remove);
    } else {
      const pending = u.status === 'pending';
      cell = h('div', { class: 'acts' },
        h('span', { class: 'chip ' + (pending ? 'allsee' : ''), text: pending ? 'Pending' : 'Declined' }),
        statusBtn(u, 'Approve', 'primary', 'approved', `${u.username} approved as User.`),
        pending && statusBtn(u, 'Decline', 'danger', 'declined', `${u.username} declined.`)
      );
    }
    return h('tr', null, h('td', { text: u.username }), h('td', { class: 'muted', text: fmtDate(u.createdAt) }), h('td', null, cell));
  });

  setKids(M.people, [banner, h('div', { class: 'tablewrap' }, h('table', null,
    h('thead', null, h('tr', null, h('th', { text: 'Username' }), h('th', { text: 'Joined' }), h('th', { text: 'Role' }))),
    h('tbody', null, rows)
  ))]);
}

show();
</script></body></html>
